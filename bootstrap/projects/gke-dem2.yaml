apiVersion: v1
kind: Namespace
metadata:
  name: gke-dem2
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceAccount
metadata:
  name: gke-dem2
spec:
  email: gke-dem2-sa@plural.sh
  tokenSecretRef:
    name: gke-dem2-sa-token
    namespace: gke-dem2
---
apiVersion: deployments.plural.sh/v1alpha1
kind: Project
metadata:
  name: gke-dem2
  # annotations:
  #   config.kubernetes.io/depends-on: deployments.plural.sh/ServiceAccount/gke-dem2
spec:
  name: gke-dem2
  description: Resources for managing the gke-dem2 fleet
  bindings:
    write:
    - userEmail: gke-dem2-sa@plural.sh
---
apiVersion: deployments.plural.sh/v1alpha1
kind: NamespaceCredentials
metadata:
  name: gke-dem2
spec:
  namespaces:
  - gke-dem2
  secretRef:
    name: gke-dem2-sa-token
    namespace: gke-dem2