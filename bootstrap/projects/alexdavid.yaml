apiVersion: v1
kind: Namespace
metadata:
  name: alexdavid
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceAccount
metadata:
  name: alexdavid
spec:
  email: alexdavid-sa@plural.sh
  tokenSecretRef:
    name: alexdavid-sa-token
    namespace: alexdavid
---
apiVersion: deployments.plural.sh/v1alpha1
kind: Project
metadata:
  name: alexdavid
  # annotations:
  #   config.kubernetes.io/depends-on: deployments.plural.sh/ServiceAccount/alexdavid
spec:
  name: alexdavid
  description: Resources for managing the alexdavid fleet
  bindings:
    write:
    - userEmail: alexdavid-sa@plural.sh
---
apiVersion: deployments.plural.sh/v1alpha1
kind: NamespaceCredentials
metadata:
  name: alexdavid
spec:
  namespaces:
  - alexdavid
  secretRef:
    name: alexdavid-sa-token
    namespace: alexdavid