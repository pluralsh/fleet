apiVersion: v1
kind: Namespace
metadata:
  name: gke-fleet-andrew
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceAccount
metadata:
  name: gke-fleet-andrew
spec:
  email: gke-fleet-andrew-sa@plural.sh
  tokenSecretRef:
    name: gke-fleet-andrew-sa-token
    namespace: gke-fleet-andrew
---
apiVersion: deployments.plural.sh/v1alpha1
kind: Project
metadata:
  name: gke-fleet-andrew
  # annotations:
  #   config.kubernetes.io/depends-on: deployments.plural.sh/ServiceAccount/gke-fleet-andrew
spec:
  name: gke-fleet-andrew
  description: Resources for managing the gke-fleet-andrew fleet
  bindings:
    write:
    - userEmail: gke-fleet-andrew-sa@plural.sh
---
apiVersion: deployments.plural.sh/v1alpha1
kind: NamespaceCredentials
metadata:
  name: gke-fleet-andrew
spec:
  namespaces:
  - gke-fleet-andrew
  secretRef:
    name: gke-fleet-andrew-sa-token
    namespace: gke-fleet-andrew