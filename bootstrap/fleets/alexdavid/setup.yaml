  name: alexdavid
spec:
  
  namespace: alexdavid
  git:
    folder: fleets/alexdavid
    ref: main
  repositoryRef:
    kind: GitRepository
    name: fleet
    namespace: fleets
  clusterRef:
    kind: Cluster
    name: mgmt
    namespace: infra